<div class="table-container">
    <table class="user-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Created At</th>
                <th>Updated At</th>
            </tr>
        </thead>

        <tbody>
           @for (user of users(); track user._id) {
            <tr>
                <td>{{ user?._id }}</td>
                <td>{{ user?.name }}</td>
                <td>{{ user?.email }}</td>
                <!-- <td>{{ user.createdAt | date:'dd-MM-yyyy HH:mm' }}</td>
                <td>{{ user.updatedAt | date:'dd-MM-yyyy HH:mm' }}</td> -->
            </tr>
            }
        </tbody>
    </table>
</div>
