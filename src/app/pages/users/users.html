<div class="table-container">
    <table class="user-table">
        <thead>
            <tr>
                <th>S.no</th>
                <th>Name</th>
                <th>Email</th>
                <th>Created At</th>
                <th>Updated At</th>
            </tr>
        </thead>

        <tbody>

           @for (user of users(); track user._id; let i= $index) {
            <tr>
                <td>{{ i + 1 }}</td>
                <td>{{ user?.name }}</td>
                <td>{{ user?.email }}</td>
                <td>{{ user.createdAt | commonDate }}</td>
                <td>{{ user.updatedAt | commonDate }}</td>
            </tr>
            }
        </tbody>
    </table>
</div>
